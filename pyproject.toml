[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-agent"
version = "0.1.0"
description = "Search conference papers and optionally translate abstracts to Vietnamese."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "feedparser>=6.0.11",
  "mineru[core]>=2.0",  # structure-aware PDF parsing (layout/table/formula); replaces pypdf. Heavy (torch); CPU pipeline backend.
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "supabase>=2.31.0",  # >=2.16 accepts new sb_publishable_/sb_secret_ keys (2.15 rejects them); 2.31 verified
  "tenacity>=8.2.0",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=2.2.0",
  "httpx>=0.27.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "numpy>=1.24.0",
  "notion-client>=2.2.1",
]

[project.scripts]
paper-agent = "agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["agent", "backend"]

[tool.setuptools.package-dir]
"" = "."
